name: FactoryOS Basic Cloud Rendering Pipeline

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'FactoryOS RenderJob ID'
        required: true
        type: string
      executionToken:
        description: 'Short-lived FactoryOS Execution Token'
        required: true
        type: string

jobs:
  render:
    name: Execute Basic FFmpeg Render
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FactoryOS Render Engine Code
        uses: actions/checkout@v4

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create Isolated Render Workspace
        run: |
          mkdir -p /tmp/factoryos-render/${{ github.event.inputs.jobId }}
          echo "Isolated workspace created for Job ${{ github.event.inputs.jobId }}"

      - name: Fetch Job Manifest & Signed Asset URLs
        env:
          CONTROL_PLANE_URL: ${{ secrets.FACTORYOS_CONTROL_PLANE_URL || 'https://factoryos.app' }}
          JOB_ID: ${{ github.event.inputs.jobId }}
          EXECUTION_TOKEN: ${{ github.event.inputs.executionToken }}
        run: |
          echo "Downloading scoped assets for Job $JOB_ID using executionToken..."
          # Real runner fetches job manifest and downloads assets using executionToken

      - name: Execute FFmpeg Render (Safe Argument Array)
        run: |
          echo "Executing FFmpeg render process..."
          # ffmpeg -y -i input.mp4 -vf "scale=1080:1920" output.mp4

      - name: Validate Generated MP4 Artifact & Upload to B2
        run: |
          echo "Verifying MP4 container header and uploading to B2 temp-renders/..."

      - name: Callback Control Plane with Status & Artifact Evidence
        if: always()
        run: |
          echo "Notifying FactoryOS Control Plane of completion/failure status..."

      - name: Clean Local Workspace
        if: always()
        run: |
          rm -rf /tmp/factoryos-render/${{ github.event.inputs.jobId }}
          echo "Local workspace cleaned."
